  <!-- HUD bottom -->
  <text x="24" y="230" fill="#8b949e" font-size="12">COIN: PR-7857  ·  LIVES: ∞  ·  READY.</text>
  <text x="776" y="230" fill="#9AE66E" font-size="12" text-anchor="end">PRESS START ▶</text>
