      <g transform="translate(200,84)"><rect x="4" y="0" width="4" height="4"/><rect x="12" y="0" width="4" height="4"/><rect x="0" y="4" width="20" height="4"/><rect x="4" y="8" width="4" height="4"/><rect x="12" y="8" width="4" height="4"/><animate attributeName="opacity" values="1;1;0;0;1" dur="0.6s" repeatCount="indefinite"/></g>
      <g transform="translate(260,84)"><rect x="4" y="0" width="4" height="4"/><rect x="12" y="0" width="4" height="4"/><rect x="0" y="4" width="20" height="4"/><rect x="4" y="8" width="4" height="4"/><rect x="12" y="8" width="4" height="4"/><animate attributeName="opacity" values="1;1;0;0;1" dur="0.6s" repeatCount="indefinite"/></g>
      <g transform="translate(320,84)"><rect x="4" y="0" width="4" height="4"/><rect x="12" y="0" width="4" height="4"/><rect x="0" y="4" width="20" height="4"/><rect x="4" y="8" width="4" height="4"/><rect x="12" y="8" width="4" height="4"/><animate attributeName="opacity" values="1;1;0;0;1" dur="0.6s" repeatCount="indefinite"/></g>
      <g transform="translate(380,84)"><rect x="4" y="0" width="4" height="4"/><rect x="12" y="0" width="4" height="4"/><rect x="0" y="4" width="20" height="4"/><rect x="4" y="8" width="4" height="4"/><rect x="12" y="8" width="4" height="4"/><animate attributeName="opacity" values="1;1;0;0;1" dur="0.6s" repeatCount="indefinite"/></g>
      <g transform="translate(440,84)"><rect x="4" y="0" width="4" height="4"/><rect x="12" y="0" width="4" height="4"/><rect x="0" y="4" width="20" height="4"/><rect x="4" y="8" width="4" height="4"/><rect x="12" y="8" width="4" height="4"/><animate attributeName="opacity" values="1;1;0;0;1" dur="0.6s" repeatCount="indefinite"/></g>
      <g transform="translate(500,84)"><rect x="4" y="0" width="4" height="4"/><rect x="12" y="0" width="4" height="4"/><rect x="0" y="4" width="20" height="4"/><rect x="4" y="8" width="4" height="4"/><rect x="12" y="8" width="4" height="4"/><animate attributeName="opacity" values="1;1;0;0;1" dur="0.6s" repeatCount="indefinite"/></g>
      <g transform="translate(560,84)"><rect x="4" y="0" width="4" height="4"/><rect x="12" y="0" width="4" height="4"/><rect x="0" y="4" width="20" height="4"/><rect x="4" y="8" width="4" height="4"/><rect x="12" y="8" width="4" height="4"/><animate attributeName="opacity" values="1;1;0;0;1" dur="0.6s" repeatCount="indefinite"/></g>
      <g transform="translate(620,84)"><rect x="4" y="0" width="4" height="4"/><rect x="12" y="0" width="4" height="4"/><rect x="0" y="4" width="20" height="4"/><rect x="4" y="8" width="4" height="4"/><rect x="12" y="8" width="4" height="4"/><animate attributeName="opacity" values="1;1;0;0;1" dur="0.6s" repeatCount="indefinite"/></g>
    </g>
