    <rect x="70" y="36" width="2" height="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="210" y="70" width="2" height="2"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></rect>
    <rect x="340" y="24" width="2" height="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="520" y="58" width="2" height="2"><animate attributeName="opacity" values="1;0.2;1" dur="2.7s" repeatCount="indefinite"/></rect>
    <rect x="650" y="30" width="2" height="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></rect>
    <rect x="740" y="88" width="2" height="2"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="120" y="120" width="2" height="2"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></rect>
    <rect x="680" y="150" width="2" height="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></rect>
