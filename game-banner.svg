  <!-- explosion on hit -->
  <g fill="#E4405F" transform="translate(414,86)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.78;0.82;0.9" dur="2.4s" repeatCount="indefinite"/>
    <rect x="-8" y="0" width="4" height="4"/>
    <rect x="4" y="0" width="4" height="4"/>
    <rect x="-4" y="-4" width="4" height="4"/>
    <rect x="0" y="4" width="4" height="4"/>
    <rect x="-12" y="4" width="4" height="4"/>
    <rect x="8" y="4" width="4" height="4"/>
  </g>

  <!-- laser beam -->
  <rect x="399" width="4" height="14" fill="#E4405F" rx="2">
    <animate attributeName="y" values="200;76;76;200" keyTimes="0;0.78;0.82;1" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.78;0.82;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- player ship -->
  <g fill="#38BDF8" transform="translate(360,0)">
    <rect x="32" y="200" width="16" height="6"/>
    <rect x="26" y="206" width="28" height="6"/>
    <rect x="20" y="212" width="40" height="6"/>
    <animateTransform attributeName="transform" type="translate" values="320,0;360,0;400,0;360,0;320,0" dur="6s" repeatCount="indefinite" additive="sum"/>
