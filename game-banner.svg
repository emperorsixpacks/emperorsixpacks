<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" font-family="'Courier New',monospace">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#1b2436" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="240" rx="12" fill="#0d1117"/>
  <rect width="800" height="240" rx="12" fill="url(#grid)"/>
  <rect x="1" y="1" width="798" height="238" rx="11" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- twinkling stars -->
