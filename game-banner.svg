      <g transform="translate(140,84)"><rect x="0" y="0" width="4" height="4"/><rect x="16" y="0" width="4" height="4"/><rect x="0" y="4" width="20" height="4"/><rect x="0" y="8" width="4" height="4"/><rect x="16" y="8" width="4" height="4"/><animate attributeName="opacity" values="0;0;1;1;0" dur="0.6s" repeatCount="indefinite"/></g>
      <g transform="translate(200,84)"><rect x="0" y="0" width="4" height="4"/><rect x="16" y="0" width="4" height="4"/><rect x="0" y="4" width="20" height="4"/><rect x="0" y="8" width="4" height="4"/><rect x="16" y="8" width="4" height="4"/><animate attributeName="opacity" values="0;0;1;1;0" dur="0.6s" repeatCount="indefinite"/></g>
      <g transform="translate(260,84)"><rect x="0" y="0" width="4" height="4"/><rect x="16" y="0" width="4" height="4"/><rect x="0" y="4" width="20" height="4"/><rect x="0" y="8" width="4" height="4"/><rect x="16" y="8" width="4" height="4"/><animate attributeName="opacity" values="0;0;1;1;0" dur="0.6s" repeatCount="indefinite"/></g>
